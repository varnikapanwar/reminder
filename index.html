
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminder V3 | Smart Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #312e81, #6d28d9);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; font-size: 32px; }
    header p { margin: 0; color: #ede9fe; }

    main { width: min(1000px, 94%); margin: 28px auto; }

    .panel {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #1e293b0d;
    }

    h2 { margin-top: 0; font-size: 20px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 5px 20px #1e293b0d;
      border-top: 4px solid #7c3aed;
    }

    .stat span { display: block; color: #64748b; font-size: 13px; }
    .stat strong { display: block; font-size: 28px; margin-top: 7px; }

    label {
      display: block;
      font-weight: 600;
      margin: 13px 0 7px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #c4b5fd;
      outline-offset: 2px;
    }

    .primary { background: #6d28d9; color: white; margin-top: 17px; }
    .done { background: #d1fae5; color: #065f46; }
    .delete { background: #fee2e2; color: #b91c1c; }

    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .reminder {
      background: white;
      border: 1px solid #e2e8f0;
      border-left: 5px solid #8b5cf6;
      border-radius: 11px;
      padding: 16px;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .reminder.overdue { border-left-color: #dc2626; }
    .reminder.completed { border-left-color: #059669; opacity: .75; }
    .reminder.completed h3 { text-decoration: line-through; }

    .details { min-width: 0; }
    .reminder h3 { margin: 0 0 7px; overflow-wrap: anywhere; }
    .reminder p { margin: 0 0 8px; color: #64748b; font-size: 13px; }

    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 999px;
      margin: 2px 5px 2px 0;
      background: #ede9fe;
      color: #5b21b6;
    }

    .tag.high { background: #fee2e2; color: #b91c1c; }
    .tag.medium { background: #fef3c7; color: #92400e; }
    .tag.low { background: #dbeafe; color: #1d4ed8; }
    .tag.overdue-tag { background: #fee2e2; color: #b91c1c; }
    .tag.completed-tag { background: #d1fae5; color: #065f46; }

    .actions { display: flex; gap: 7px; flex-wrap: wrap; flex-shrink: 0; }
    .empty { text-align: center; color: #64748b; padding: 24px 0; }
    #status { min-height: 20px; color: #475569; }

    footer { text-align: center; color: #64748b; padding: 0 20px 25px; font-size: 13px; }

    @media (max-width: 650px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filters { grid-template-columns: 1fr; }
      .reminder { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📊 Reminder V3 Dashboard</h1>
    <p>Your tasks, priorities, and deadlines in one place.</p>
  </header>

  <main>
    <section class="stats" aria-label="Reminder summary">
      <div class="stat">
        <span>Total</span>
        <strong id="total-count">0</strong>
      </div>
      <div class="stat">
        <span>Upcoming</span>
        <strong id="upcoming-count">0</strong>
      </div>
      <div class="stat">
        <span>Overdue</span>
        <strong id="overdue-count">0</strong>
      </div>
      <div class="stat">
        <span>Completed</span>
        <strong id="completed-count">0</strong>
      </div>
    </section>

    <section class="panel">
      <h2>Create a Reminder</h2>
      <form id="reminder-form">
        <label for="title">Reminder title</label>
        <input id="title" type="text" maxlength="120"
               placeholder="e.g. Submit assignment" required>

        <label for="due">Date and time</label>
        <input id="due" type="datetime-local" required>

        <label for="priority">Priority</label>
        <select id="priority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>

        <button class="primary" type="submit">+ Add Reminder</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <h2>Manage Reminders</h2>

      <div class="filters">
        <div>
          <label for="search">Search</label>
          <input id="search" type="search" placeholder="Search reminder titles">
        </div>
        <div>
          <label for="priority-filter">Priority</label>
          <select id="priority-filter">
            <option value="all">All priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div>
          <label for="status-filter">Status</label>
          <select id="status-filter">
            <option value="all">All reminders</option>
            <option value="upcoming">Upcoming</option>
            <option value="overdue">Overdue</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </div>

      <div id="reminder-list"></div>
    </section>
  </main>

  <footer>Reminder V3 · Dashboard · Filters · Priority · Status Tracking</footer>

  <script>
    const STORAGE_KEY = "reminder-app-items-v3";

    const form = document.getElementById("reminder-form");
    const titleInput = document.getElementById("title");
    const dueInput = document.getElementById("due");
    const priorityInput = document.getElementById("priority");
    const searchInput = document.getElementById("search");
    const priorityFilter = document.getElementById("priority-filter");
    const statusFilter = document.getElementById("status-filter");
    const list = document.getElementById("reminder-list");
    const statusMessage = document.getElementById("status");
    const notified = new Set();

    let reminders = [];

    try {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (Array.isArray(stored)) {
        reminders = stored.filter(item =>
          item &&
          typeof item.id === "string" &&
          typeof item.title === "string" &&
          typeof item.due === "string" &&
          !Number.isNaN(new Date(item.due).getTime())
        ).map(item => ({
          id: item.id,
          title: item.title,
          due: item.due,
          priority: ["high", "medium", "low"].includes(item.priority)
            ? item.priority : "medium",
          done: Boolean(item.done)
        }));
      }
    } catch {
      reminders = [];
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reminders));
        return true;
      } catch {
        statusMessage.textContent =
          "Could not save reminders in this browser.";
        return false;
      }
    }

    function getStatus(item) {
      if (item.done) return "completed";
      return new Date(item.due).getTime() <= Date.now()
        ? "overdue"
        : "upcoming";
    }

    function updateSummary() {
      const counts = {
        total: reminders.length,
        upcoming: 0,
        overdue: 0,
        completed: 0
      };

      reminders.forEach(item => {
        counts[getStatus(item)]++;
      });

      document.getElementById("total-count").textContent = counts.total;
      document.getElementById("upcoming-count").textContent = counts.upcoming;
      document.getElementById("overdue-count").textContent = counts.overdue;
      document.getElementById("completed-count").textContent = counts.completed;
    }

    function makeTag(text, className) {
      const tag = document.createElement("span");
      tag.className = "tag " + className;
      tag.textContent = text;
      return tag;
    }

    function render() {
      updateSummary();
      list.replaceChildren();

      const search = searchInput.value.trim().toLowerCase();
      const selectedPriority = priorityFilter.value;
      const selectedStatus = statusFilter.value;

      const filtered = [...reminders]
        .filter(item => item.title.toLowerCase().includes(search))
        .filter(item =>
          selectedPriority === "all" || item.priority === selectedPriority
        )
        .filter(item =>
          selectedStatus === "all" || getStatus(item) === selectedStatus
        )
        .sort((a, b) => {
          const priorityOrder = { high: 0, medium: 1, low: 2 };
          if (priorityOrder[a.priority] !== priorityOrder[b.priority]) {
            return priorityOrder[a.priority] - priorityOrder[b.priority];
          }
          return new Date(a.due) - new Date(b.due);
        });

      if (filtered.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = reminders.length === 0
          ? "No reminders yet. Add your first task above."
          : "No reminders match your current filters.";
        list.appendChild(empty);
        return;
      }

      filtered.forEach(item => {
        const state = getStatus(item);
        const card = document.createElement("article");
        card.className = "reminder" +
          (state === "overdue" ? " overdue" : "") +
          (item.done ? " completed" : "");

        const details = document.createElement("div");
        details.className = "details";

        const heading = document.createElement("h3");
        heading.textContent = item.title;

        const time = document.createElement("p");
        time.textContent = new Date(item.due).toLocaleString();

        const tags = document.createElement("div");
        tags.appendChild(makeTag(
          item.priority.toUpperCase() + " PRIORITY",
          item.priority
        ));

        const labels = {
          upcoming: ["UPCOMING", ""],
          overdue: ["OVERDUE", "overdue-tag"],
          completed: ["COMPLETED", "completed-tag"]
        };

        tags.appendChild(makeTag(labels[state][0], labels[state][1]));
        details.append(heading, time, tags);

        const actions = document.createElement("div");
        actions.className = "actions";

        const toggleButton = document.createElement("button");
        toggleButton.className = "done";
        toggleButton.textContent = item.done ? "Reopen" : "Complete";
        toggleButton.addEventListener("click", () => {
          item.done = !item.done;
          save();
          render();
          statusMessage.textContent = item.done
            ? "Reminder completed."
            : "Reminder reopened.";
        });
        actions.appendChild(toggleButton);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => {
          reminders = reminders.filter(r => r.id !== item.id);
          notified.delete(item.id);
          save();
          render();
          statusMessage.textContent = "Reminder deleted.";
        });
        actions.appendChild(deleteButton);

        card.append(details, actions);
        list.appendChild(card);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const title = titleInput.value.trim();
      const dueValue = dueInput.value;
      const due = new Date(dueValue);

      if (!title || !dueValue || Number.isNaN(due.getTime())) {
        statusMessage.textContent = "Please enter a valid title and date/time.";
        return;
      }

      if (due.getTime() <= Date.now()) {
        statusMessage.textContent = "Please select a future date and time.";
        return;
      }

      const item = {
        id: crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now().toString() + Math.random().toString(16).slice(2),
        title,
        due: due.toISOString(),
        priority: priorityInput.value,
        done: false
      };

      reminders.push(item);

      if (!save()) {
        reminders = reminders.filter(r => r.id !== item.id);
        return;
      }

      render();
      form.reset();
      priorityInput.value = "medium";
      updateMinimumDate();
      statusMessage.textContent = "Reminder added successfully.";
    });

    function updateMinimumDate() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      dueInput.min = now.toISOString().slice(0, 16);
    }

    function checkDueReminders() {
      reminders.forEach(item => {
        if (
          !item.done &&
          new Date(item.due).getTime() <= Date.now() &&
          !notified.has(item.id)
        ) {
          notified.add(item.id);
          alert("⏰ Reminder: " + item.title);
        }
      });

      render();
    }

    searchInput.addEventListener("input", render);
    priorityFilter.addEventListener("change", render);
    statusFilter.addEventListener("change", render);

    updateMinimumDate();
    render();
    checkDueReminders();
    setInterval(checkDueReminders, 5000);
  </script>
</body>
</html>
