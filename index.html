
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminder V2 | Priority Planner</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ecfdf5, #f8fafc);
      color: #172033;
    }

    header {
      background: #047857;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; font-size: 32px; }
    header p { margin: 0; color: #d1fae5; }

    main { width: min(800px, 92%); margin: 30px auto; }

    .panel {
      background: white;
      padding: 24px;
      margin-bottom: 22px;
      border-radius: 16px;
      box-shadow: 0 8px 28px #1e293b12;
    }

    h2 { margin-top: 0; font-size: 21px; }

    label {
      display: block;
      font-weight: 600;
      margin: 14px 0 7px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #6ee7b7;
      outline-offset: 2px;
    }

    .primary { background: #047857; color: white; margin-top: 18px; }
    .done { background: #d1fae5; color: #065f46; }
    .delete { background: #fee2e2; color: #b91c1c; }

    #status { color: #475569; min-height: 20px; margin-bottom: 0; }

    .reminder {
      border: 1px solid #e2e8f0;
      border-left: 5px solid #10b981;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .reminder h3 { margin: 0 0 7px; font-size: 16px; overflow-wrap: anywhere; }
    .reminder p { margin: 0 0 9px; color: #64748b; font-size: 13px; }

    .details { min-width: 0; }
    .actions { display: flex; gap: 7px; flex-shrink: 0; flex-wrap: wrap; }

    .priority {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      margin: 0 6px 5px 0;
    }

    .high { background: #fee2e2; color: #b91c1c; }
    .medium { background: #fef3c7; color: #92400e; }
    .low { background: #dbeafe; color: #1d4ed8; }
    .completed { opacity: 0.65; }
    .completed h3 { text-decoration: line-through; }
    .empty { color: #64748b; text-align: center; padding: 20px 0; }

    footer {
      text-align: center;
      color: #64748b;
      padding: 0 20px 25px;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      .reminder { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1>✅ Reminder V2</h1>
    <p>Prioritize your work. Track every task.</p>
  </header>

  <main>
    <section class="panel">
      <h2>Create a Reminder</h2>
      <form id="reminder-form">
        <label for="title">Reminder title</label>
        <input id="title" type="text" maxlength="120"
               placeholder="e.g. Submit assignment" required>

        <label for="due">Date and time</label>
        <input id="due" type="datetime-local" required>

        <label for="priority">Priority</label>
        <select id="priority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>

        <button class="primary" type="submit">+ Add Reminder</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <h2>My Reminders</h2>
      <div id="reminder-list"></div>
    </section>
  </main>

  <footer>Reminder V2 · Priority · Completion · Notifications</footer>

  <script>
    const STORAGE_KEY = "reminder-app-items-v2";
    const form = document.getElementById("reminder-form");
    const titleInput = document.getElementById("title");
    const dueInput = document.getElementById("due");
    const priorityInput = document.getElementById("priority");
    const list = document.getElementById("reminder-list");
    const status = document.getElementById("status");
    const notified = new Set();

    let reminders = [];

    try {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (Array.isArray(stored)) {
        reminders = stored.filter(item =>
          item &&
          typeof item.id === "string" &&
          typeof item.title === "string" &&
          typeof item.due === "string" &&
          !Number.isNaN(new Date(item.due).getTime())
        ).map(item => ({
          id: item.id,
          title: item.title,
          due: item.due,
          priority: ["high", "medium", "low"].includes(item.priority)
            ? item.priority : "medium",
          done: Boolean(item.done)
        }));
      }
    } catch {
      reminders = [];
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reminders));
        return true;
      } catch {
        status.textContent = "Could not save reminders in this browser.";
        return false;
      }
    }

    function updateMinimumDate() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      dueInput.min = now.toISOString().slice(0, 16);
    }

    function render() {
      list.replaceChildren();

      if (reminders.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No reminders yet. Create your first task above.";
        list.appendChild(empty);
        return;
      }

      [...reminders]
        .sort((a, b) => new Date(a.due) - new Date(b.due))
        .forEach(item => {
          const card = document.createElement("article");
          card.className = "reminder" + (item.done ? " completed" : "");

          const details = document.createElement("div");
          details.className = "details";

          const heading = document.createElement("h3");
          heading.textContent = item.title;

          const time = document.createElement("p");
          time.textContent = new Date(item.due).toLocaleString();

          const priority = document.createElement("span");
          priority.className = "priority " + item.priority;
          priority.textContent = item.priority.toUpperCase() + " PRIORITY";

          const state = document.createElement("span");
          state.className = "priority " + (item.done ? "low" : "medium");
          state.textContent = item.done
            ? "COMPLETED"
            : (new Date(item.due) <= new Date() ? "DUE" : "UPCOMING");

          details.append(heading, time, priority, state);

          const actions = document.createElement("div");
          actions.className = "actions";

          if (!item.done) {
            const doneButton = document.createElement("button");
            doneButton.className = "done";
            doneButton.textContent = "Mark Done";
            doneButton.addEventListener("click", () => {
              item.done = true;
              save();
              render();
              status.textContent = "Reminder marked as completed.";
            });
            actions.appendChild(doneButton);
          } else {
            const undoButton = document.createElement("button");
            undoButton.className = "done";
            undoButton.textContent = "Reopen";
            undoButton.addEventListener("click", () => {
              item.done = false;
              save();
              render();
              status.textContent = "Reminder reopened.";
            });
            actions.appendChild(undoButton);
          }

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete";
          deleteButton.textContent = "Delete";
          deleteButton.addEventListener("click", () => {
            reminders = reminders.filter(r => r.id !== item.id);
            notified.delete(item.id);
            save();
            render();
            status.textContent = "Reminder deleted.";
          });

          actions.appendChild(deleteButton);
          card.append(details, actions);
          list.appendChild(card);
        });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const title = titleInput.value.trim();
      const dueValue = dueInput.value;
      const due = new Date(dueValue);

      if (!title || !dueValue || Number.isNaN(due.getTime())) {
        status.textContent = "Please enter a valid title and date/time.";
        return;
      }

      if (due.getTime() <= Date.now()) {
        status.textContent = "Please select a future date and time.";
        return;
      }

      const item = {
        id: crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now().toString() + Math.random().toString(16).slice(2),
        title,
        due: due.toISOString(),
        priority: priorityInput.value,
        done: false
      };

      reminders.push(item);

      if (!save()) {
        reminders = reminders.filter(r => r.id !== item.id);
        return;
      }

      render();
      form.reset();
      priorityInput.value = "medium";
      updateMinimumDate();
      status.textContent = "Reminder created successfully!";
    });

    function checkDueReminders() {
      reminders.forEach(item => {
        if (
          !item.done &&
          new Date(item.due).getTime() <= Date.now() &&
          !notified.has(item.id)
        ) {
          notified.add(item.id);
          alert("⏰ Reminder: " + item.title);
        }
      });
      render();
    }

    updateMinimumDate();
    render();
    checkDueReminders();
    setInterval(checkDueReminders, 5000);
  </script>
</body>
</html>
