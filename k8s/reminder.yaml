apiVersion: apps/v1
kind: Deployment
metadata:
  name: reminder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reminder
  template:
    metadata:
      labels:
        app: reminder
    spec:
      containers:
        - name: reminder
          image: varnikapanwar/reminder:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: reminder-service
spec:
  type: NodePort
  selector:
    app: reminder
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30084
