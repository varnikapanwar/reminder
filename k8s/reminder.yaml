apiVersion: apps/v1
kind: Deployment
metadata:
  name: reminder-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reminder-v1
  template:
    metadata:
      labels:
        app: reminder-v1
    spec:
      containers:
        - name: reminder
          image: varnikapanwar/reminder:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: reminder-v1-service
spec:
  type: ClusterIP
  selector:
    app: reminder-v1
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reminder-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reminder-v2
  template:
    metadata:
      labels:
        app: reminder-v2
    spec:
      containers:
        - name: reminder
          image: varnikapanwar/reminder:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: reminder-v2-service
spec:
  type: ClusterIP
  selector:
    app: reminder-v2
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reminder-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reminder-v3
  template:
    metadata:
      labels:
        app: reminder-v3
    spec:
      containers:
        - name: reminder
          image: varnikapanwar/reminder:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: reminder-v3-service
spec:
  type: ClusterIP
  selector:
    app: reminder-v3
  ports:
    - port: 80
      targetPort: 80
